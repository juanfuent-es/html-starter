<!--
  Documento base HTML semántico
-->
<!doctype html>
<html lang="es">
<head>
    <!--
      @meta: charset
      Define la codificación de caracteres.
      Docs: https://developer.mozilla.org/es/docs/Web/HTML/Element/meta#attr-charset
    -->
    <meta charset="UTF-8" />
    <!--
      @meta: viewport
      Controla el tamaño y escala en móviles.
      Docs: https://developer.mozilla.org/es/docs/Web/HTML/Viewport_meta_tag
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      @title
      Título de la pestaña. Importante para SEO y accesibilidad.
    -->
    <title>HTML Starter | CENTRO</title>
    <!--
      @favicon
      Ícono del sitio. Formato SVG recomendado.
    -->
    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg" />

    <!-- Metadatos Open Graph (RRSS) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Semantic HTML | Starter Markup" />
    <meta property="og:description" content="Base para HTML semántico y accesibilidad." />
    <meta property="og:url" content="https://juanfuent-es.github.io/html-starter/" />
    <!--
      @styles
      Hoja de estilos externa.
      Docs: https://developer.mozilla.org/es/docs/Web/HTML/Element/link
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/hero.css" />
</head>

<body>

  <!-- HEADER: identidad y accesos principales -->
  <header>
    <a href="https://github.com/juanfuent-es" target="_blank" rel="noopener noreferrer" title="Ir al perfil de GitHub" aria-label="Ir al perfil de GitHub">
      <i class="fa-brands fa-github" aria-hidden="true"></i>
    </a>
  </header>

  <!-- MAIN: contenido principal del documento -->
  <main>

    <!--
      HERO
      "Hero" no es una etiqueta HTML semántica.
      Usamos un div para agrupar esta unidad de contenido.
    -->
    <div class="hero">
      <h1>Título Principal</h1>

      <p>Tagline / Descripción</p>

      <!-- CTA: enlace hacia el recurso principal -->
      <a href="https://github.com/juanfuent-es/html-starter" target="_blank" rel="noopener noreferrer">
        Ver en GitHub
      </a>
    </div>

  </main>

  <!--
    FOOTER: información complementaria.

    Los grupos "izquierda" y "derecha" son una intención de layout visual.
    HTML sólo estructura aquí dos grupos de información.
  -->
  <footer>

    <!-- Grupo institucional -->
    <div class="footer-info">
      <a href="https://centro.edu.mx/" target="_blank" rel="noopener noreferrer" title="Ir al sitio de CENTRO" aria-label="Ir al sitio de CENTRO">
        <img src="./img/centro-logo.svg" alt="CENTRO" width="120" height="24">
      </a>

      <address>
        <p>
          <a href="https://maps.app.goo.gl/QzhCvoLRDLP3NZJLA" target="_blank" rel="noopener noreferrer" title="Ver ubicación en el mapa">
            Av. Constituyentes 455, CDMX
          </a>
        </p>

        <p>
          <a href="tel:+525527899000" title="Llamar a CENTRO">(+52) 55 2789 9000</a>
        </p>
      </address>
    </div>

    <!-- Grupo de redes: enlaces sólo-ícono, con title/aria-label para nombre accesible y tooltip -->
    <div class="footer-social">
      <ul>
        <li>
          <a href="https://instagram.com/centro_u" target="_blank" rel="noopener noreferrer" title="Instagram" aria-label="Instagram">
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a href="https://linkedin.com/school/centro-edu-mx/" target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a href="https://facebook.com/centro.edu.mx/" target="_blank" rel="noopener noreferrer" title="Facebook" aria-label="Facebook">
            <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a href="https://tiktok.com/@centro.edu.mx" target="_blank" rel="noopener noreferrer" title="TikTok" aria-label="TikTok">
            <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a href="https://youtube.com/@centro_u" target="_blank" rel="noopener noreferrer" title="YouTube" aria-label="YouTube">
            <i class="fa-brands fa-youtube" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </div>

  </footer>

  <script src="./js/script.js"></script>
</body>

</html>
